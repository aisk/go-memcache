name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install memcached for the integration tests
        run: sudo apt-get update && sudo apt-get install -y memcached
      - run: test -z "$($(go env GOROOT)/bin/gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
